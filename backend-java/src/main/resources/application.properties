server.port=5000

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cinemaDB}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# schema.sql runs on every start (all statements use IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-at-least-32-chars}
app.jwt.expiration-ms=604800000
app.cors.origin=${CORS_ORIGIN:http://localhost:3000}
# Leave empty to use mock payments in development
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.seed=${SEED:true}
